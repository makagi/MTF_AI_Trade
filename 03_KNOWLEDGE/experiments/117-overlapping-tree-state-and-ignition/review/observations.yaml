observations:
  - id: OBS-117-1
    topic: "重複ツリー状態空間による無支持落下ナイフ遮断と強気スクイーズ逆張り抑止（HYP-117-1 Supported）"
    summary: "EXP-115のCase 2（2021-01-30 03:00 Long: -1.94%）において、急落中の落下ナイフ局面（S21/S34の下落かつAFS整流ゼロかつ親支持不在）で早仕掛けしていた課題を解決。フィボナッチ9スケール重複3分岐ツリー状態空間を構築し、最短期トリプレット L1(8,13,21) < 0 かつ マクロ親アンカー支持 L1(89,144,233) <= 0 の無支持自由落下状態（Unanchored Knife）を厳密に検知・遮断。また、ショート側でも上位波束 L2[8..55] > 0.45 の強気スクイーズ局面での逆張りショートを遮断するゲートを導入。"
    evidence: "Case 2 の落下ナイフ被弾（-1.94%）を完全に無力化・除外。Stage 0 から Stage 1 への移行において、Long Solo の PF が 2.20 から 2.50 へ、純利益が +185.2% から +209.4% へ向上（勝率 37.5% -> 39.7%）。Short Solo でも PF が 3.01 から 3.68（勝率 36.7% -> 44.0%、純利益 +68.5% -> +74.8%）へ向上。Master Std は PF 2.35 -> 2.70、純利益 +253.7% -> +284.2%、Mode A も PF 2.36 -> 2.81、純利益 +196.3% -> +224.9%、MaxDD -15.5% -> -14.2% と全指標で大幅改善。HYP-117-1 を支持（Supported）と判定。"
    implication: "固定スカラー値によるノイズフィルタではなく、フィボナッチ多重スケールのトリプレット幾何コヒーレンスを用いることで、落下の危険域と安全域を厳密に分離できることが立証された。"

  - id: OBS-117-2
    topic: "遅延ツリー波束コヒーレンス確定による再点火エントリー（HYP-117-2 Supported）"
    summary: "落下ナイフ遮断により回避されたエントリーシグナル（Pending Trigger）に対し、S233下限バンド割れによる無効化を通過することなく、短期・中期・長期の全移動平均線群が上向き順行パーフェクトオーダーかつツリー波束 L2[8..55] > 0.25 かつ マクロレジーム L3[13..233] > 0.15 の幾何コヒーレンスを確定させた瞬間に再エントリーを点火（Deferred Ignition）するモデルを導入。"
    evidence: "Case 2 において、2021-01-30 03:00 の落下ナイフを遮断した直後、二番底を経て 2021-02-02 15:00 にツリー波束パーフェクトコヒーレンスが確定した瞬間（$35,528）に遅延再点火を実行。112.65時間保有し +9.25%（Stage 2）/ +8.31%（Stage 3 S89エグジット）の高収益トレードとして回収に成功。Master Std において取引数 N=156 -> 157、純利益 +284.2% -> +293.5%（PF 2.76）、Mode B においても PF 2.82 -> 2.88、純利益 +274.0% -> +283.3% へ拡大。HYP-117-2 を支持（Supported）と判定。"
    implication: "1バーの点クロスによる早仕掛け自滅や見送りの機会損失を排し、『状態が整うまで待機し波束コヒーレンス完成で点火する』幾何学的遅延制御の極めて高い実効性が証明された。"

  - id: OBS-117-3
    topic: "ツリー・コヒーレンス連動型多階層呼吸（S89再拡張）による大相場推進力（HYP-117-3 Supported）"
    summary: "EXP-115 の S55 防衛床呼吸モデルを進化させ、上位波束 L2[34..233] > 0.70 かつ L1(55,89,144) > 0.70 かつ S55 > S89 > S144 > S233 のメガインパルス拡張期には、防衛アンカーを S55 から一段親の S89 へとさらに再拡張（深呼吸）し、大相場の途中の深いプルバックを吸収して極大トレンドを完走させる機構を導入。"
    evidence: "Case 2 に続く大相場推進波（2021-02-04 20:00 Long: $37,645）において、Stage 0〜2 では 2021-02-10 18:11 に S55 で決済（+20.33%, 142.18h）されていたところ、Stage 3 の S89 深呼吸により押し目を完全吸収し、2021-02-13 14:06（$47,272）まで保有期間を 210.1時間に拡大して +25.65%（+5.32%pt 向上）を動的完走。Master Std は Stage 2（+293.5%, PF 2.76）から Stage 3（+339.3%, PF 3.03）へと純利益 +45.8%pt 増加、PF 3.00 の大台を突破。Mode A でも +213.6%（PF 2.66）から +251.7%（PF 3.05）へ、Mode B でも +283.3%（PF 2.88）から +310.4%（PF 3.08）へ全モードで劇的進化を達成。HYP-117-3 を支持（Supported）と判定。"
    implication: "多階層アンカーの呼吸は S55 に限定されず、ツリー・コヒーレンスが極大値を示す局面では S89 以上の親スケールまで深呼吸を許容することで、メガトレンドの Right-Tail を極限まで引き出せることが定量実証された。"

  - id: OBS-117-4
    topic: "EXP-117 統合ツリー状態空間ポートフォリオの真値評価と本番ベースライン維持ガバナンス（EXP-109 堅持）"
    summary: "HYP-117-1、HYP-117-2、HYP-117-3 を統合した純粋幾何モデル（Stage 3）の総合評価を実施。Master Std (N=157) において Net EV +2.16%、PF 3.03、累積純利益 +339.3%、MaxDD -23.5% を記録。Mode A (N=123) においても Net EV +2.05%（95% CI [+0.96%, +3.24%]）、PF 3.05、累積純利益 +251.7%、MaxDD -14.2% を達成。Mode B (N=148) においても Net EV +2.10%（95% CI [+1.04%, +3.28%]）、PF 3.08、累積純利益 +310.4%、MaxDD -18.0% を記録。"
    evidence: "前世代 EXP-115（Std: +253.7%, PF 2.35; Mode A: +196.3%, PF 2.36; Mode B: +240.8%, PF 2.38）から純利益 +85.6%pt 向上、PF 3.00 を全モードで完全突破。全6暦年中5年で特大黒字（2020: +88.0%, 2021: +66.1%, 2023: +48.1%, 2024: +47.9%, 2025: +4.5%、2022年ベア相場のみ -2.9%）。しかし、確定生産ベースライン EXP-109（Master Std: +412.92%, PF 3.83; Mode A: +274.9%, PF 3.07）には僅差で届かないため、プロジェクト憲章およびガードレール⑥に基づき decision: CONSTRAINED と判定。本番確定ベースラインは EXP-109 を維持。"
    implication: "固定スカラー値・マジックナンバーを一切排除した純粋幾何学的ツリー状態空間モデルが、確定生産ベースライン（EXP-109: +412.9% / +274.9%）の背中を捉える領域（+339.3% / +251.7% / +310.4%、PF 3.05〜3.08）まで急速に接近したことを確認。次世代構造モデルの金字塔として記録。"
