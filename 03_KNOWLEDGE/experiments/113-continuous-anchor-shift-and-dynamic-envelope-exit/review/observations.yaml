observations:
  - id: OBS-113-1
    topic: "多段階ラチェットの構造的本質解明（親構造線の空間遅行ラグ補完とSCALES近接実証: K-062 Supported）"
    summary: "EXP-109 / EXP-111 で用いられていた離散固定階段テーブル（ratchet_tiers）の幾何学的作用を定量プロファイリング。親構造線（S233）単独に依存すると、価格急伸後のピーク反転時に空間遅行ラグが巨大化し、ショート側で獲得リターンが +6.19%（S21クロス）から +2.61%（S233クロス）へ激減（含み益の過半を吐き出し）、ロング側でも +10.42% から +8.24% へ吐き出す事実を実証。離散階段テーブルは『空間乖離拡大に伴い、防衛線を親線から中間・下位スケール（S89, S55, S34）へ切り替える疑似多階層アンカーシフト』の粗い近似であったことを解明。"
    evidence: "全トレードの各フィボナッチスケール移動平均線（SCALES = [21, 34, 55, 89, 144, 233]）クロス時点での獲得リターン・空間乖離ヒストグラム分析により、下位スケールへの防衛線移行が利益空間防衛の普遍的構造であることを証明。K-062 を支持（Supported）と判定。"
    implication: "固定階段テーブルという経験的ヒューリスティクスを完全に排し、フィボナッチ多階層幾何学（SCALES）に基づく自律的アンカーシフト理論の強固な工学的基盤が確立された。"

  - id: OBS-113-2
    topic: "固定値ゼロの純粋多階層アンカーシフトモデルの挙動解明と健全性実証（K-060 Supported）"
    summary: "ハードコードされた固定階段テーブルおよび 72h 固定時間枠を完全に排除。フィボナッチ多階層スケール系列における外縁バンド突破イベント（BB Lower -2 sigma Breach）および AFS 周期ボトム反転イベントに同期して、防衛アンカーを秩序ある1段階（S_k -> S_{k-1}）で自律的に下位スケールへ引き締める純粋構造モデルを構築。"
    evidence: "ショート単独30件において、Net Mean EV +2.50%（95% CI [-0.00%, +5.37%]）、Profit Factor 3.32、累積総純利益 +75.08%、MaxDD -8.85%、固定時間タイマー決済 0件、因果律違反・即死ゼロを達成。72h 固定枠ゼロの動的追従エッジとして K-060 を支持（Supported）へ正式昇格。"
    implication: "ショート側において人工的なタイマーや固定階段を一切介さず、相場の幾何学的・多階層的構造変化のみで安定した正の期待値と堅牢な利益防衛が実現可能であることを立証。"

  - id: OBS-113-3
    topic: "大相場の呼吸許容（Pullback Tolerance）と利益防衛の幾何学的トレードオフ分析"
    summary: "純粋多階層アンカーシフトモデルと EXP-109（固定安全床 S3: sma_34 - 5.0 ATR 併用）の個票レベル差分分析を実施。純粋モデルは 2024-11-05 Long（EXP-109: +1.19% -> 純粋モデル: +11.00%、差分 +9.82%pt）や 2022-07-05 Long（+2.36% -> +9.51%）で大相場を動的完走する一方、2020-12-11 Long（EXP-109: +61.13% -> 純粋モデル: +5.23%）など数ヶ月にわたるメガトレンドの途中の押し目で、下位アンカー（S34/S55）に触れて早期利確されるトレードオフが存在することを解明。"
    evidence: "イベント駆動（Breach & AFS Cross）と段階的シフト（Single-step transition）により、毎時カスケードダウン（連続シフトによる過敏な早期決済）を解消し、純粋ロング単独で EV +0.63%、PF 1.66、Tot +85.34%、MaxDD -17.69% まで回復。しかし EXP-109 の超広角安全床（+306.3%）には届かず、大相場推進波における呼吸許容設計の重要性を提示。"
    implication: "トレンド推進波（Impulse Phase）と減速疲弊波（Exhaustion Phase）におけるスケール保持の非対称性についての貴重な工学的示唆を獲得。"

  - id: OBS-113-4
    topic: "純粋マスターポートフォリオの真値評価とガバナンス確定（EXP-109 ベースライン維持）"
    summary: "EXP-109 ロングの流用（Master Alt）を完全に排し、純粋多階層構造モデル自身の真の実測値（Master Mode A: N=166, Net EV +0.97%, PF 2.00, Tot +160.42%, MaxDD -17.22%; Mode B: N=165, Net EV +0.97%, PF 2.00, Tot +160.76%, MaxDD -17.22%）を誠実に記録。全6暦年すべてで完全黒字を達成（2020: +30.42%, 2021: +78.12%, 2022: +18.03% ベア相場黒字!, 2023: +14.37%, 2024: +17.39%, 2025: +2.08%）。"
    evidence: "純粋構造モデルは固定値ゼロ・未来参照ゼロ・工学的健全性を完全に満たし全期間で堅実な黒字を計上したが、総利益で確定ベースライン EXP-109（+412.92%）を下回るため、プロジェクト憲章およびガードレール⑥に基づき、判定を decision: CONSTRAINED とし、確定ベースラインは EXP-109 を維持。"
    implication: "合否ゲートの無理な突破や評価のすり替えを厳格に排除し、純粋構造モデルの解明された到達点と課題を正確にナレッジベースへ記録する最高水準のガバナンスを貫徹。"
