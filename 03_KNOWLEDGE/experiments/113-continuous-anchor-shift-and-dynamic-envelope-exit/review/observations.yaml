author: makagi
reviewer: Antigravity

observations:
  - id: OBS-113-1
    topic: "多段階ラチェットの構造的本質解明（疑似多階層エンベロープと親構造線遅行ラグ補完: K-062 Supported）"
    summary: "EXP-109 / EXP-111 において利益防衛の柱を担っていた離散ラチェット（ratchet_tiers）の幾何学的作用を定量プロファイリング。ラチェット決済時、現在価格は親構造線（240h Mid）から平均 +4.88 ATR（ロング）および +7.24 ATR（ショート）も上方に置き去りにされており、決済価格は中間線（80h Mid）〜短期線（20h Mid）直上（平均 -0.07 ATR）に位置していた事実を実証。離散階段テーブルが『親構造線の遅行ラグを埋め、中間・短期スケールへアンカーシフトさせる疑似多階層エンベロープ』として機能していたことを解明。"
    evidence: "ロング54件、ショート7件のラチェット決済トレードの定量分析により、親構造線追随のみに依存した場合の深刻な Round-trip（含み益の 65%〜70% 吐き出し）と、ラチェットによる中間・短期構造線水準への引き締め効果を立証。K-062 を支持（Supported）と判定。"
    implication: "急激なボラティリティ膨張局面における親構造線の空間的遅行ラグを定量的に把握し、進行ボラティリティに応じたエンベロープ制御への理論的基礎が確立された。"

  - id: OBS-113-2
    topic: "ショート側非対称動的エンベロープ追随による K-060 完全確立（Supported 昇格）"
    summary: "72h固定時間枠を完全撤廃（0件）した上で、下落進行空間とボラティリティに応じた連続動的エンベロープ（初期ブレークイーブン防衛＋進行中連続ロック＋12 ATR超での大相場呼吸幅10.5 ATR確保）を導入。2021年5月暴落（305時間追随、+30.50%）をフルキャプチャしつつ、2022年6月（+9.60%）等の反発を的確に防衛。"
    evidence: "ショート単独30件において、Net Mean EV +3.63%（事前登録要求 >= +3.50% 達成）、Profit Factor 6.40（要求 >= 6.00 達成）、累積総純利益 +108.86%（要求 >= +100.0% 大台突破）、最大DD -5.39%（EXP-109 の -6.29% から改善）を記録。EXP-111 で Inconclusive だった K-060 を支持（Supported）へ正式昇格。"
    implication: "ショート側の幾何学的非対称性（急激な落下速度とV字ショートカバー）に適応した動的エンベロープにより、固定時間枠に依存しない恒久的なエッジが実証された。"

  - id: OBS-113-3
    topic: "上値抵抗帯制約（K-061）の精緻化とロング往来相場リターンの回復"
    summary: "EXP-111 で課題となった 2024年往来レンジ相場での過敏な早刈りを防ぐため、480h親構造線の統計的有意な下降傾斜条件（bb_slope_480h < -0.015）を精緻化。フラットな往来相場での誤作動を抑止。"
    evidence: "2024年の年間リターンは +27.30%（事前登録目標 >= +25.0% 達成、EXP-111 の +9.28% から完全回復）を達成。一方で、2022年ベア相場（+3.68% vs 目標 >= +12.0%）および 2023年（+50.97% vs 目標 >= +54.0%）において目標水準に未達となったため、制約付き知見（Constrained）と判定。"
    implication: "上位構造線の傾斜閾値によるフラット相場の弁別は有効であるが、ベア相場における反発ロングの精密制御には更なるレジーム判別が必要。"

  - id: OBS-113-4
    topic: "EXP-113 Master ポートフォリオのガバナンス評価と確定ベースライン（EXP-109）の維持"
    summary: "EXP-113 Master Alt Mode A（EXP-109 Long + EXP-113 Short）において、Net Mean EV +2.50%（EXP-109 の +2.49% 超）、累積純利益 +415.18%（EXP-109 の +412.92% 超）を達成。全6暦年すべてにおいて完全黒字を堅持（2020: +139.74%, 2021: +180.98%, 2022: +3.68%, 2023: +50.97%, 2024: +27.30%, 2025: +12.52%）。"
    evidence: "EVと総利益では EXP-109 を上回ったものの、Profit Factor が 3.81（事前登録目標 >= 4.00 未達、EXP-109 は 3.83）、MaxDD が -16.78%（事前登録目標 <= -12.40% 未達）となった。ガードレール⑥に基づき、強引なベースライン更新を排し、判定を decision: CONSTRAINED とし、本番確定ベースラインは EXP-109 を維持。"
    implication: "全主要指標の同時達成が満たされない場合はベースライン昇格を見送る厳格なガバナンスを徹底し、プロジェクトの科学的証拠性と再現性を完全に担保した。"
