    status: "Supported (Physics & Regime Audit K-097) / Refuted (Long Veto Filter K-098)"
    description: "Replicates the exact MQL5 BufferEMAZL formula across 17 Fibonacci scales S_17=[8..17711] with strict full-window warmup (bar_idx >= period + lag, lag=(period-1)//2) and zero-lookahead invariance (max_diff=0.0 at t_cut=44200). Cuts RMSE vs SMA by 36.6%-46.2% and shortens optimal lag 3x-4x. Separates BTCUSD into 4 regimes (N_ev=2,339), isolating MOR Case 04/06/07 FP traps inside Z_SUBMERGED_PARALLEL (only negative 72h mean -0.325R) while concentrating 10/10 EXP-145 Mega-Runners in Z_BULL_ABOVE (6) and Z_FLOOR_SPRING (4). However, applying Z_SUBMERGED_PARALLEL as a hard veto on EXP-145 Champion Longs reduces Std Tot across all 16/16 cells (-22.05%pt to -51.58%pt) and is rejected as over-filtering."
  - id: "HYP-147-2"
    name: "ZLEMA WaitGuard Pullback Longs (3A) & Case 02 Multi-Scale Floor-Spring Longs (3B)"
    status: "Refuted / Constrained (K-098)"
    description: "Tests expanding EXP-145 WaitGuard pullback longs via ZLEMA ultra-macro gating (3A) and adding Case 02-inspired macro floor-spring sweeps across ZLEMA/BB_lo >= 377 (3B). While 3B captures the exact Case 02 bounce (2025-01-13 23:00Z, Net +8.62%) and reaches standalone N=248, PF 1.30, +118.09% at 2flr_24h, both 3A and 3B fail single-digit MaxDD and Era2 (2023-2025) constraints: 3A widens Std MDD to -28.74% across all 16/16 cells (Era2 -9.98%..-28.11%); 3B 2flr_24h widens SA MDD to -111.05% / Std MDD to -36.74%, suffers Era2 -34.88%, and drops Champion Mega-Runners 10/10 -> 8/10 via 24h Track-2 cooldown collision."
  - id: "HYP-147-3"
    name: "ZLEMA T1 Cascade Exit Substitution vs SMA & Submerged-Parallel Ceiling Reversal Shorts"
    status: "Refuted / Constrained (K-098)"
    description: "Compares ZLEMA vs SMA inside the EXP-145 T1_Full_D4_RelaxFlip cascade exit (D>=4, phi_mid<0.25) and tests Case 06-inspired Submerged-Parallel ceiling reversal shorts across a 4x4 grid (subm_thr >= 0.625..1.00 x k_up_depth >= 3..6). ZLEMA T1 trims Std MaxDD (-9.30% -> -8.52%) but overshoots sensitivity (triggers 4 -> 9), clipping 1 Mega-Runner (MG 9/10, Std +720.14% vs SMA +752.07%, Mode B +571.12% vs +604.34%). Submerged-Parallel shorts yield 0/16 positive cells (WR 7.69%-29.07%, PF 0.02-0.51, SA Tot -5.83% to -73.57%), reinforcing K-096."

