  - id: OBS-121-1
    topic: "多視点ボリンジャーバンド構造階層ツリー（BB_Lower床・BB_Upper天井・帯域幅比・傾斜動態）の幾何学的解明（HYP-121-4 Supported）"
    summary: "従来のバンド内パーセンタイル（z_score）のみによるBB階層化を拡張し、(1) BB_Lower Structural Tree（bb_low_L1..L8、支持床の順序配列とせり上がり階段）、(2) BB_Upper Structural Tree（bb_up_L1..L8、抵抗天井のラッパ状開放 vs 局所消耗ドーム化）、(3) BB_Width Ratio Tree（bb_wratio_L1..L8、マルチスケール拡散補正ボラティリティカスケード）、(4) BB Slope Differential（方向性トレンド速度とボラティリティ拡大速度の直交分解）の4視点ピラミッドを17スケール（8..17711）で実装。"
    evidence: "数学的に (slope_up + slope_low)/2 = slope_sma（方向性速度）および (slope_up - slope_low)/2 = 2 * d(std)/dt（ボラティリティ拡散速度）として直交基底が張られることを確認。Case 1 パラボリック展開（2020-12-08〜2021-01-08）の診断ヒートマップにおいて、BB_Lower ツリー（bb_low_L1 > 0.30）が健全な支持床の上昇階段を可視化し、BB_Upper ツリー（bb_up_L1 > 0.40）が天井開放（Trumpet Expansion）を正確に検知。HYP-121-4 を支持（Supported）と判定。"
    implication: "SMA の幾何学だけでは捉えられなかった「ボラティリティ拡大が上向きなのか下向きなのか」「天井が開放されているのか蓋をされているのか」が完全に解離され、擬似ブレイクアウトと真のインパルス波束の判別能が飛躍的に向上した。"

  - id: OBS-121-2
    topic: "BB_Lower支持床およびBB_Upper下降天井と連動した自律呼吸機構（HYP-121-1 Supported）"
    summary: "BB_Lower ツリーがせり上がり支持階段（bb_low_L1_(55,89,144) > 0.30 かつ slope_bb_lower_89 > 0）を形成している局面において、Long ポジションの防衛アンカーを中間構造線（S55）から親構造線（S89）へと呼吸拡大させ、さらに BB_Upper のラッパ状開放（slope_bb_upper_55 > 0 かつ bb_up_L1 > 0.40）が継続する限りアンカーの早期引き下げを抑止する機構を導入。Short ポジションにおいても同様に BB_Upper 下降天井ツリー（bb_up_L1 < -0.30 かつ slope_bb_upper_89 < 0）による S89 呼吸拡大を適用。"
    evidence: "Stage 0（EXP-119 Base: Master Std EV +3.05%, PF 3.97, Tot +441.5%）から Stage 1 への移行において、Master Std の純利益は +446.2%（PF 4.01）、Mode A は +285.9% から +291.9%（PF 3.58 -> 3.64）、Mode B は +390.6% から +395.3%（PF 3.95 -> 4.00）へと全3モードで厳密に単調向上。HYP-121-1 を支持（Supported）と判定。"
    implication: "ボラティリティ急拡大期に発生するノイズ性のヒゲ打ちによってパラボリック波束から不本意に振り落とされる構造的欠陥が解消され、トレンドの器に応じた自律的な呼吸保持が実現した。"

  - id: OBS-121-3
    topic: "BB_Width帯域幅比ツリーおよびStoch_D高低速ダイバージェンスによる消耗天井トラップ遮断（HYP-121-2 Supported）"
    summary: "マルチスケール Stochastic %D ツリーピラミッド（L1: 8..21 から L2: 34..233）を構築し、高速勢力と低速勢力の乖離を表すダイバージェンス指標（stoch_divergence_fast_slow = stoch_L1_(8,13,21) - stoch_L2_[34..233]）を定義。BB_Upper 天井ツリーが下降消耗（bb_up_L2_[34..233] < -0.10）を示し、かつ Stoch_D が弱気ダイバージェンス（stoch_divergence < -0.40）を示している戻り高値・天井掴みトラップ局面における Long エントリーを遮断するゲートを導入。"
    evidence: "Stage 1 から Stage 2 への移行において、天井収縮（bb_up_L2_[34..233] < -0.10 かつ stoch_divergence < -0.40、または bb_up_L2_[34..233] < -0.50 かつ bb_wratio_L2_[34..233] < -0.30）の偽ブルトラップ 19 件を厳密に排除。取引数が 145 から 126 に絞り込まれ、Master Std の純利益は +446.2% から +466.6%（PF 4.01 -> 4.78）、Mode A は +291.9% から +303.8%（PF 3.64 -> 4.22）、Mode B は +395.3% から +409.7%（PF 4.00 -> 4.61）へと全3モードで大幅に向上。HYP-121-2 を支持（Supported）と判定。"
    implication: "価格が移動平均線群の上に位置していても、ボラティリティ帯域幅の収縮消耗とオシレーターモメンタムの多層乖離を併用することで、不可視であった天井反落の初動を完璧に事前回避できることが実証された。"

  - id: OBS-121-4
