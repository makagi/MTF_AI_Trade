observations:
  - id: OBS-109-1
    topic: "スケール相対的エスカレーション（Reclaim Ignition）による架空0秒決済の完全根絶"
    summary: "親構造線（10日線）より下でエントリーする深い押し目において、エントリー直後の初足即死（duration_h == 0.0）を解消。親構造線奪還までは初期防衛線（p0 - 3.0 ATR）と48hタイムアウトで守り、奪還・上抜け（cur_high >= cur_parent_line）した瞬間に無期限親構造線追随へ昇格させるロジックにより、duration_h == 0.0 を完全0件としつつ大底押し目の大勝を保護。"
    evidence: "初版39件の架空0秒決済（duration_h == 0.0）が完全に0件へ是正。2022-07-05や2024-03-23などの深い押し目トレードの勝率・利益が正常に発揮され、全期間勝率が 46.39% -> 57.23% へ向上。"
    implication: "親構造線より下で拾う深い押し目と親構造線より上でのモメンタム追随という構造的差異を、階層的昇格ロジックで数学的・市場力学的に整合させた。"

  - id: OBS-109-2
    topic: "反証実験によるレジーム適応（Regime Separation）の不可欠性の実証"
    summary: "全期間一律にレンジ用早期引き締め（Uniform Squeeze: 3.0/1.0, 4.2/2.2, 6.0/3.5, 8.0/5.0 ATR および 4H Mid急加速）を適用したところ、トレンド相場（Expansion）の健全な押し目呼吸（2〜3 ATR）が刈り取られ、通期リターンが半減した。"
    evidence: "HYP-109-2 (Uniform Squeeze): 通期総利益 +207.41% (PF 2.46) vs レジーム適応型マスター: +412.92% (PF 3.83)。一律引き締めにより -205.51%pt もの大トレンド利益が破壊された。"
    implication: "レンジ利益防衛とトレンド呼吸許容は同一パラメータでは両立不可能であり、幾何学的レジーム判別器（bb_width_pct_2160 <= 0.45 かつ abs(bb_slope_240h) <= 0.04）による適応的切り替えが市場物理的に不可欠であることが反証された。"

  - id: OBS-109-3
    topic: "静的多段階動的ラチェットと4H BB Mid急加速の客観的役割分担"
    summary: "多段階ラチェット（3.5/1.0, 5.5/2.5, 8.0/4.5 ATR）を単調非減少で導入したことが全体の利益底上げの大半を牽引。一方、4H BB Mid急加速ストップの発火件数は全136件中わずか2件（rapid_4h_mid_stop: 2）であり、限定的な安全装置として機能していることが客観的データにより判明。"
    evidence: "エグジット内訳: 親構造線追随 37件、多段階ラチェットロック 54件、4H Mid急加速 2件、初期リスクストップ 18件、奪還タイムアウト 5件、安全フロアS3 18件。"
    implication: "特定の小仕掛け（4H Mid急加速）への過度な因果帰属を排し、多段階動的利益確保（54件）と親構造線追随（37件）の調和こそが真の駆動力であることを客観的に特定した。"

  - id: OBS-109-4
    topic: "ポートフォリオ統合による大台更新と2024年往来相場リターンの大幅底上げ"
    summary: "ショート側（EXP-103/107基準仕様: 計30件、Net EV +3.55%、PF 6.68、総利益 +106.60%）と統合し、全6年（2020〜2025年）すべてでプラス収支を堅持。特に課題であった2024年リターンが +7.25% -> +26.95% へ急伸。"
    evidence: "通期総利益 +412.92% (Mode A) / +406.16% (Mode B)、通期PF 3.83、MaxDD -12.40%。2024年は +26.95% (PF 2.15) を達成。100h超トレンドポジション25件の平均MFEは 31.42 ATR。"
    implication: "トレンドの大波を無期限に捕獲しつつ、レンジ往来相場での含み益逃避を多段階ラチェットで防衛する堅牢な全天候型エグジット体系が完成した。"
