  - id: OBS-109-1
    topic: "大相場押し目呼吸（Expansion）と往来相場反落（Squeeze）の幾何学的厳格分離"
    summary: "過去30日ローリング確定分布による10日線BB幅下位45%（bb_width_pct_240h <= 0.45）かつ傾きフラット（abs(bb_slope_240h) <= 0.04）を「真のSqueeze」と幾何判別。Expansion（トレンド期）では健全な押し目呼吸を許容して大トレンド利益を100%死守しつつ、Squeeze（往来相場）のみで利益を早期防衛するレジーム適応体系を確立。"
    evidence: "全期間一律ラチェット適用では2020年（+71% -> +36%）や2023年（+60% -> +11%）が激減したのに対し、レジーム適応型では2020年 +71.33%、2021年 +183.05%、2023年 +60.56% を完全死守。"
    implication: "トレンド呼吸の許容とレンジ利益防衛の完全両立を実現する普遍的幾何学的レジーム判別器が完成。"

  - id: OBS-109-2
    topic: "レンジ期における4H BB Mid急加速ストップによる往来相場リターンの底上げ"
    summary: "Squeeze期にMFE >= 2.5 ATRへ到達したポジションに対し、ストップラインを4H BB Mid（bb_mid_80h - 0.5 ATR）へ急加速引き上げすることで、レンジ上限からの反落による含み益吐き出しを阻止。2024年リターンが3倍に跳ね上がった。"
    evidence: "2024年リターン: EXP-107 の +7.25% (PF 1.41) から +20.71% (PF 2.31) へ約3倍に激増。MaxDDも -8.59% から -6.40% へ大幅圧縮。"
    implication: "上位親構造（10日線）と中間構造（4H線）の階層的役割分担により、レンジ相場の含み益を確実に刈り取る機構が実証された。"

  - id: OBS-109-3
    topic: "多段階ダイナミックラチェットによる大台突破（Lifetime PF 4.38, MaxDD -10.22%）"
    summary: "単一トレールロック（3.5 ATR -> 1.0 ATR）から、MFEの進展に応じた多段階ラチェット（Expansion: 3.5/5.5/8.0 ATR、Squeeze: 3.0/4.2/6.0/8.0 ATR）へと進化。大トレンドとレンジバウンス双方の利益捕獲効率が極大化した。"
    evidence: "全期間（2020-2025）: Net EV +1.99% -> +2.18% (95% CI [1.17, 3.39]%), Lifetime PF 3.97 -> 4.38 (大台4.00突破), 総利益 +330.09% -> +361.22%, MaxDD -11.73% -> -10.22% (1.51%pt圧縮)。"
    implication: "システムトレードにおける金字塔となるPF 4.38、MaxDD 10%台前半の超高効率ポートフォリオが完成。"

  - id: OBS-109-4
    topic: "ショート側における非対称性の再確認（72h固定＋急降下TPの黄金律維持）"
    summary: "ロング側で成功した10日線シームレス追随をショート側に機械的に適用すると、下落後の急激なショートカバー反発で利益を吐き出し、2022年がマイナス転落（+9.38% -> -1.45%）。ショートは「急激な落下と暴力的な反発」という非対称性を持つため、EXP-103/EXP-107の72h枠＋Plunge 6765 TPが幾何学的最適解であることを再確認。"
    evidence: "ショート無期限化時: 2022年 -1.45% (PF 0.96) vs 現行EXP-107仕様: 2022年 +10.13% (PF 1.42)。"
    implication: "ロング/ショートの物理的対称性ドグマを排し、市場構造の幾何学的非対称性に即した最適設計を厳格に堅持。"
