  - id: OBS-107-2
    topic: "上位BB上限での早漏利確（切り株利確）リスクとトレンド追随一本化の幾何学的優位性"
    summary: "並行レンジ判定時であっても、上位BB上限到達での機械的利確（Range TP）は、ブレイクアウト初動の爆発的トレンド獲得利益を激減させる。"
    evidence: "Range TP有効時: Net EV +1.10%, PF 2.68, 総利益 +149.32% vs 無効時（シームレス追随）: Net EV +1.64%, PF 3.42, 総利益 +223.49%（+74.17%pt の巨大な機会損失）。"
    implication: "「利は伸ばし損は切れ」の物理原則に従い、上位足Lock-In局面では利確ルールを完全停止し構造線割れまでの無期限追随（Trend Riding）に一本化することが幾何学的最適解。"

  - id: OBS-107-3
    topic: "72h二重構造の完全撤廃と普遍的親構造線（10日線 bb_mid_240h）によるシームレス動的エグジット"
    summary: "「72hでロジックを切り替える二重構造」を完全撤廃し、エントリー直後から親構造線割れまでシームレスに追随する単一ルールに刷新。特定SMA固定を排し、時間足中立な10日線（bb_mid_240h）を採用したことで、ロング単体のPFが 2.05 から 3.42 へ急伸した。"
    evidence: "ロング単体: N=136, Net EV +1.19% -> +1.64% (+45 bps), PF 2.05 -> 3.42 (+1.37向上), 総利益 +161.61% -> +223.49% (+61.88%pt)。"
    implication: "Anti-Dogma原則を徹底し、特定の固定本数への依存を排した普遍的親階層動的構造線が確立された。"

