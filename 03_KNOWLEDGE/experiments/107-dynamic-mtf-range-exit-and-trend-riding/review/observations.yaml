  - id: OBS-107-2
    topic: "上位BB上限での早漏利確（切り株利確）リスクとトレンド追随一本化の幾何学的優位性"
    summary: "並行レンジ判定時であっても、上位BB上限到達での機械的利確（Range TP）は、ブレイクアウト初動の爆発的トレンド獲得利益を激減させる。"
    evidence: "Range TP有効時: Net EV +1.02%, PF 1.95, 総利益 +139.07% vs 無効時（トレンド追随のみ）: Net EV +1.73%, PF 2.59, 総利益 +235.16%（+96.09%pt の巨大な機会損失）。"
    implication: "「利は伸ばし損は切れ」の物理原則に従い、上位足Lock-In局面では利確ルールを完全停止し構造線割れまでの無期限追随（Trend Riding）に一本化することが幾何学的最適解。"

  - id: OBS-107-3
    topic: "72h固定枠撤廃と構造線割れ（SMA 144）による大相場無期限追随の威力"
    summary: "72h固定時間枠を完全撤廃し、メソ構造線（SMA 144）割れまで無期限追随させたことで、ロング単体の総利益が +161.61% から +235.16% へ激増した。"
    evidence: "ロング単体: N=136, Net EV +1.19% -> +1.73% (+54 bps), PF 2.05 -> 2.59 (+0.54), 総利益 +161.61% -> +235.16% (+73.55%pt)。2020年・2021年の大相場利益が倍増。"
    implication: "初期検証の観測窓であった72h固定枠のドグマを完全打破し、構造線幾何学に基づく動的エグジットが確立された。"

  - id: OBS-107-4
    topic: "双方向統合マスターポートフォリオ（Mode A vs Mode B）の頑健性"
    summary: "EXP-107 双方向統合マスターは、Mode A（独立パス）で Net EV +2.06%, PF 3.05, 総利益 +341.76% を達成。実運用制約（同時保有上限 Max 2 ポジション）の Mode B でも Net EV +2.06%, PF 3.02, 総利益 +326.22% と極めて高い頑健性を実証した。"
