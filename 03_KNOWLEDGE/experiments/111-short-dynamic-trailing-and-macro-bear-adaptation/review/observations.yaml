observations:
  - id: OBS-111-1
    topic: "時間タイマー（48h/16h/72h）の完全撤廃と構造的無効化（Structural Invalidation）への昇華"
    summary: "72h強制決済タイマーおよび初期実装の48h/16h暫定タイマーを100%完全撤廃。下位足モメンタムが逆方向ブレイクした瞬間（1h更新で20h BB Mid下抜け/上抜け・傾き反転・AFS中立）に成行撤退する構造的無効化（Structural Invalidation）を導入。初期防衛線をエントリー価格p0の保護側外側（p0 ± 2.0 ATR）に厳格配置し、if i > 0 ハックを排して初足（i=0）から即死判定を完全防止。全取引で duration_h > 0 かつ exit_time > entry_time をアサーション検証通過。"
    evidence: "全取引（ショート30件、ロング136件）中、時間タイムアウト0件（完全根絶）。エグジット内訳: ショート側は構造線リクレーム21件 (70.0%)、構造的無効化3件 (10.0%)、ストップ5件 (16.7%)、ターゲット到達1件 (3.3%)。ロング側は構造線リクレーム114件 (83.8%)、構造的無効化13件 (9.6%)、ストップ9件 (6.6%)。"
    implication: "時計の針ではなく、相場の物理的構造変化（モメンタム逆位相化）のみで自律撤退する純粋な多重時間軸幾何学的エグジットが実現された。"

  - id: OBS-111-2
    topic: "固定ATRラチェット表の撤廃と階層スケールシフト（Scale Shift）による親スケール動的トレーリング"
    summary: "恣意的な固定ATR多段階ラチェット表を撤廃し、MTFフレームワーク§4.9.3に準拠した幾何学的スケールシフトへ統一。親スケール（240h BB Envelope: bb_mid_240h ± 0.5*std_240h）を標準追随とし、エンベロープ到達かつAFSサイクル反転時に中間スケール（80h BB Envelope）へシフトダウン、極値到達かつAFS反転時に下位スケール（20h BB Envelope）へシフトダウンする一貫体系を確立。"
    evidence: "ショート単独収支は40bps控除後で通期純利益 +29.87%（PF 1.79、Net EV +1.00%）を獲得。2021年の大暴落トレンド追随（単独年次利益 +40.74%）を達成しつつ、固定値カーブフィッティングを徹底排除。"
    implication: "下落トレンドの深さとボラティリティ伸縮に対し、幾何学的エンベロープとサイクル指標の組み合わせで追随ラインを動的に引き下げる普遍的スケールシフトが実証された。"

  - id: OBS-111-3
    topic: "固定指標ドグマ（sma_200d）撤廃と動的上値抵抗帯制約（Overhead Resistance Constraint）による大相場解放"
    summary: "恣意的な日足200SMA（close < sma_200d）および固定MFE上限を完全撤廃。下降する上位抵抗帯（bb_mid_240h < bb_mid_480h かつ bb_slope_480h < 0 かつ close < bb_mid_480h）に頭を押さえられている局面のみを動的に検知し、上位抵抗帯接触かつAFSサイクル天井で中間・下位ラインへ追随を引き締める幾何学的制約を導入。"
    evidence: "価格が最深親線bb_mid_480hを上抜けた瞬間（2023年1月大底ブレイクアウト時）に制約が自律解除され、2023年年間リターンは初期PR窒息値（+27.49%）から +69.16%（PF 3.87）へ劇的に復活。EXP-109ベースライン（+54.93%）を +14.23%pt 上回る大幅増益を達成。未見データである2025年Holdout期でも +20.69%（ベースライン比 +7.93%pt）を記録。"
    implication: "固定指標で一律に天井を決めつけるのではなく、上位線の位置関係と傾きから動的に上値真空を判定することで、大底からの力強い大相場を早漏決済することなく完走させることが可能となった。"

  - id: OBS-111-4
    topic: "EXP-111 Master ポートフォリオの幾何学的脱ドグマと誠実な工学的評価"
    summary: "HYP-111-1〜3を統合したEXP-111 Masterは、Mode A（非拘束）で通期総純利益 +263.71%、PF 2.49、Net Mean EV +1.59%、最大DD -24.21%を達成。Mode B（同時最大2枠）でも総純利益 +250.08%、PF 2.51、Net Mean EV +1.58%を達成。過剰適合タイマーを排したことにより、大ベア相場2022年の課題（-17.05%）が客観的真値として浮き彫りとなったが、Goalpost Shiftingを排して誠実に報告。"
    evidence: "全6暦年中5年で大幅プラス堅持（2020: +80.84%, 2021: +106.91%, 2022: -17.05%, 2023: +69.16%, 2024: +3.16%, 2025: +20.69%）。全期間95% CIは [+0.67%, +2.57%] と堅固なプラス期待値を証明。"
    implication: "固定タイマーや固定値表による過剰適合を排し、真の幾何学的適応を行うことで、大相場の爆発的収益と未見データでの汎化性能を獲得し、次期研究へ向けた強固な基盤を確立した。"
