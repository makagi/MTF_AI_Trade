observations:
  - id: OBS-111-1
    topic: "時間タイマー（72h）の完全撤廃・因果律厳格化・即死バグの物理的根絶"
    summary: "72h強制決済タイマーを100%完全撤廃（0件）。1時間足確定バー参照 (t_bar - pd.Timedelta(hours=1)).floor('1h') により未来参照リークを物理的に完全排除。分足エグジット時刻を exit_time = t_bar + pd.Timedelta(minutes=1)、保有時間を dur_h = (i + 1) / 60.0 と定義し、ヒステリシス欠落による duration_h <= 0 即死バグを物理的に完全根絶。全取引で duration_h > 0 かつ exit_time > entry_time をアサーション検証通過。"
    evidence: "全取引（ショート30件、ロング136件）中、時間タイムアウト0件（完全撤廃）。エグジット内訳: ショート側は動的構造線リクレーム16件 (53.3%)、利益防衛ラチェット7件 (23.3%)、ストップ3件 (10.0%)、構造的無効化2件 (6.7%)、ターゲット到達2件 (6.7%)。ロング側はレジーム適応ラチェット51件 (37.5%)、親構造線リクレーム32件 (23.5%)、動的S3ストップ17件 (12.5%)、構造的無効化15件 (11.0%)、初期防衛線11件 (8.1%)、4Hミドル割れ8件 (5.9%)、検証期間終了2件 (1.5%)。"
    implication: "因果律に違反しない確定足参照と、物理的最小時間を担保したエグジット構造により、バックテストの健全性と監査性が完全に回復された。"

  - id: OBS-111-2
    topic: "ショート側幾何学的動的構造線トレール（K-060: Inconclusive / Constrained）"
    summary: "マクロ下降相場（Lock-In Bear）時は240h親構造線、非Lock-In時は80h中間構造線をトレール。2021年5月の歴史的急落（2021-05-12 06:00 取引）を305時間追随して +30.50%（MFE 45.79 ATR）で完全捕捉。Plunge Shortでも多段階利益防衛ラチェットと10日線トレールにより、2023-08-18 取引の全戻し損切りを防止し +0.87% 利確。"
    evidence: "ショート単独収支は40bps控除後で通期純利益 +90.54%（PF 4.95、Net Mean EV +3.02%、MaxDD -6.66%）。72h固定枠を撤廃し大幅黒字を達成したものの、事前登録基準（PF 6.00、累積利益 +100%）に僅差未達（EXP-109比 -16.06%pt）となったため、K-060は制約付き知見（Inconclusive）と判定。"
    implication: "巨大トレンドの追随性能を実証した一方、往来相場における中間構造線への押し目・戻りによる早期利確・撤退が課題として明確化された。"

  - id: OBS-111-3
    topic: "大局ベア相場ロング適応制御（Overhead Resistance Constraint）（K-061: Supported）"
    summary: "下降親構造線（bb_mid_240h < bb_mid_480h かつ bb_slope_480h < 0 かつ close < bb_mid_480h）に頭を押さえられている局面のみを動的に検知し、上位抵抗帯接触かつ AFS サイクル天井で追随を引き締める幾何学的適応制御を導入。"
    evidence: "Ablation 3（ロング大局ベア適応単独）において、Lifetime PF 4.02（4.00大台突破！）、通期累積総利益 +405.62%、MaxDD -12.23%（ベースラインより縮小）を達成。2022年ベア相場のロング収支を +5.30% から +10.85% へ倍増させ、2023年も +57.08%、2025年Holdout期も +13.36% とベースラインを上回る増益を記録したため、K-061は支持（Supported）と判定。"
    implication: "親構造線の位置関係と傾きから大局ベア相場での上値抵抗を動的に検知することで、大相場の呼吸を阻害せずベア局面のロング損失を圧縮する強力なエッジが実証された。"

  - id: OBS-111-4
    topic: "EXP-111 Master ポートフォリオのガバナンス評価とベースライン維持"
    summary: "EXP-111 Masterは全6暦年すべてにおいて完全黒字を堅持（2020: +140.82%, 2021: +167.25%, 2022: +6.28%, 2023: +52.40%, 2024: +10.06%, 2025: +12.76%）。Mode A（非拘束）で通期総純利益 +389.57%、PF 3.81、Net Mean EV +2.35%、最大DD -12.83%を達成。全期間95% CIは [+1.12%, +3.79%] と堅固な正の期待値を証明。"
    evidence: "通期累積総利益において EXP-109 Baseline（+412.92%, PF 3.83）に対し -23.35%pt 下回っており、Issue #111 §4 の事前登録目標（PF 4.00, Total +420%）に未達。ガバナンス規則および Goalpost Shifting 厳禁に基づき、判定を decision: CONSTRAINED（制約付き知見・探索的採択）とし、本番確定ベースラインは EXP-109 を維持。"
    implication: "未達結果を隠蔽せず客観的真値として誠実に開示し、本番ベースラインの昇格を厳格に見送ることで、プロジェクトの科学的証拠性とガバナンス整合性が完全に保全された。"
