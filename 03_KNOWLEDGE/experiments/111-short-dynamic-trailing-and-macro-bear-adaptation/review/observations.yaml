observations:
  - id: OBS-111-1
    topic: "ショート側72h固定枠の完全撤廃とブレイクダウン昇格着火判定（Reclaim Breakdown Ignition）"
    summary: "ショート側ポジションにおける72h固定強制決済タイマーを100%完全撤廃。エントリー直後の架空即死（duration_h == 0.0）を防止するため、構造線下抜け（p0 < cur_struct - 0.2*atr または cur_low <= cur_struct - 0.2*atr）までは初期防衛線（p0 + 2.5 ATR）および安全床S3（sma_34 + 5.0 ATR）で守り、下抜けた瞬間に動的追随へ昇格（Reclaim Breakdown Ignition）させる機構を導入。duration_h == 0.0 を完全0件としつつ、ショート単独PF 5.05、Net EV +2.47% を達成。"
    evidence: "全ショート取引30件中、72hタイムアウト0件、duration_h == 0.0 0件（アサーション検証済み）。エグジット内訳: 構造線リクレーム 17件 (56.7%)、動的ラチェットロック 6件 (20.0%)、初期ストップ 5件 (16.7%)、ターゲット到達 2件 (6.7%)。"
    implication: "ロング側（EXP-107/109）に続き、ショート側からも時計の針に基づく人工的ドグマを完全排斥し、純粋な幾何学的構造線とボラティリティのみで自律駆動するエグジットアーキテクチャが完成した。"

  - id: OBS-111-2
    topic: "ショート親スケール相対性（Lock-In Bear 10日線無期限追随 vs 通常時4H Mid早期利益確保）"
    summary: "下落相場の非対称性（垂直落下と暴力的なショートカバーの急反発）に対応するため、大局下落環境（MTF Lock-In Bear: bb_mid_20h < bb_mid_80h < bb_mid_480h & bb_slope_480h < 0）では10日線（bb_mid_240h + 0.5 ATR）を無期限追随し、通常期・レンジ期では4H BB Mid（bb_mid_80h + 0.0 ATR）＋動的ラチェットで急激な踏み上げに巻き込まれる前に機敏に利益を固定化する親スケール相対性を導入。"
    evidence: "2021年の大暴落局面において10日線追随が機能し、2021年ショート単独利益 +91.40% (PF 26.52) を獲得。通常期・レンジ期（2022年）では4H Midにより巻き戻し前に利益確定し、2022年ショート単独利益 +25.70% (PF 12.59) を達成。"
    implication: "下落トレンドの深さと巻き戻し速度の違いをMTF階層構造によって幾何学的に識別し、無期限追随と機敏な利確の二律背反を親スケール相対性により美しく調和させた。"

  - id: OBS-111-3
    topic: "大局完全ベア相場（Macro Bear）におけるロング初期リスク引き締めと2022年収支の3倍増"
    summary: "日足200SMA下位かつ10日線下向き（close < sma_200d & bb_slope_240h < 0）の大局完全ベア相場環境下において、ロングの初期リスク枠を 1.0 ATR、リクレーム失敗期限を 16h に適応的に引き締め。落ちるナイフ環境での深追い損切りを劇的に圧縮しつつ、2023年の大底反発利益（+47.89%）を一切毀損しない適応制御を確立。"
    evidence: "2022年のロング損失を圧縮し、ショート利益（+25.70%）と相乗して、2022年のポートフォリオ年間収支は EXP-109の +5.30% (PF 1.17) から +15.14% (PF 1.57) へ約3倍（+9.84%pt）に急伸。最大ドローダウンも -14.72% -> -11.06% へ圧縮。"
    implication: "マクロ環境が完全に下落優位にある場合の「初期リスク枠の縮小」と「早期撤退」が、歴史的弱気相場におけるサバイバル能力と収益性を決定づける構造的防壁となることを実証した。"

  - id: OBS-111-4
    topic: "幾何学的完全性と全6年完全プラス維持のEXP-111 Masterポートフォリオ"
    summary: "HYP-111-1〜3を統合したEXP-111 Masterは、Mode A（非拘束）およびMode B（同時最大2枠）の双方において、2020〜2025年（Holdout含む）全6暦年で完全にプラス収支を維持。通期総純利益 +387.59% (Mode A) / +380.83% (Mode B)、PF 3.81 / 3.76、Net Mean EV +2.33% / +2.37% を達成。"
    evidence: "Mode A 暦年収支: 2020: +138.43%, 2021: +144.73%, 2022: +15.14%, 2023: +47.89%, 2024: +26.17%, 2025: +15.24%。Mode B 暦年収支: 2020: +134.93%, 2021: +142.82%, 2022: +15.14%, 2023: +47.65%, 2024: +25.07%, 2025: +15.24%。全6年全プラス堅持。"
    implication: "固定タイマーを一切持たない純粋な多重時間軸幾何学的システムとして、過去5年4ヶ月のあらゆる相場環境（バブル上昇、大暴落、大ベア相場、大底反発、高ボラ往来相場、未見データ）において頑健に機能する最高峰のポートフォリオが完成した。"
