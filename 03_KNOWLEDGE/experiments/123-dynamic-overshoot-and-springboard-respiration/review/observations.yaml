observations:
  - id: OBS-123-1
    topic: "無次元前方過伸長射影（Omega_Up / Omega_Down）と8層ピラミッドによるマクロ包絡線逸脱度の幾何学的定式化"
    summary: "急激な価格変動が短期・中長期ボリンジャーバンド（BB）の許容帯域を突破した際、中長期トレンドが追いつくまでの期間（レイテンシ）において発生する弾性引き戻し（Elastic Mean-Reversion Pullback）を数理的にモデル化。局所速度ベクトル v_fast とスケール適合先読み幅 delta_t = 0.236 * S_k を用いて無次元過伸長度 Omega^up_{S_k}(t) = (P_proj - Env_up_proj) / BB_width を 17 スケール（8..17711）で算出し、8 層オーバーラッピング・ツリーピラミッドへと昇華させた。"
    evidence: "Case 1（2020年12月メガブル波束）および Case 2（2024年2月ブレイクアウト）の幾何学的診断において、価格急騰直後に短期バンド（S21..S55）で Omega^up > 0.80 の過伸長が発生し、その後必然的に発生した揺り戻し押し目によって、固定アンカー縮小を行っていた旧システムが直前で刈り取られていた力学を完全解明。"
    implication: "急激な変化そのものを盲目的に追いかけるのではなく、「今どのスケールの上限をどの程度逸脱しているのか」を無次元量として常時把握可能となり、ブレイクアウト初期の揺り戻しを事前に予測する幾何学的基盤が確立された。"

  - id: OBS-123-2
    topic: "動的レイテンシ吸収呼吸（HYP-123-1 Supported）による弾性引き戻し揺り戻しの吸収と早期振り落とし防止"
    summary: "急激なバンドブレイクアウトにより前方流動性過伸長（Omega^up > 0.20）が点灯している期間中、中長期移動平均線群がトレンドに追いつくためのレイテンシを許容するため、ストップ防衛アンカーの S34/S21 への早期引き下げを抑止し、親構造線（S55/S89）にてポジションを堅持するレイテンシ吸収呼吸機構を導入。"
    evidence: "Stage 0（EXP-121 Baseline: Master Std EV +3.74%, PF 4.90, Tot +471.9%）から Stage 1 への移行において、Master Std の純利益は +471.9% から +678.3%（PF 4.90 -> 5.78, EV +3.74% -> +5.10%）、Mode A は +308.0% から +592.0%（PF 4.35 -> 6.29, EV +3.14% -> +5.59%）、Mode B は +414.8% から +667.9%（PF 4.75 -> 6.31, EV +3.49% -> +5.30%）へと全 3 モードで劇的に単調向上。HYP-123-1 を支持（Supported）と判定。"
    implication: "トレンド初動の急変化による一時的な揺り戻しで好位ポジションを不本意に失う脆弱性が完全に解消され、大局トレンドの器に合わせた自律的な弾力保持が可能となった。"

  - id: OBS-123-3
    topic: "動的前方過伸長ゲート（HYP-123-2 Supported）による天井掴み・戻り高値トラップ遮断"
    summary: "中長期トレンドの傾きが下向き（slope_{S_k} < 0）かつ支持床が未防衛（not is_floor_defended）であり、超長期ブルの後ろ盾がない（tree_L2_[610..4181] < 0.60）状況下で、極度の過伸長（Omega^up >= 0.80）を記録している局面における Long エントリーを吹き上がり天井掴みトラップとして遮断するゲートを導入。"
    evidence: "Stage 1 から Stage 2 への移行において、2022年8月10日の偽ブレイク・急落負けトレード（-0.75%）を勝ちトレードの犠牲ゼロ（犠牲数 0 件）で完全に遮断。Master Std の純利益は +678.3% から +680.7%（PF 5.78 -> 5.88, EV +5.10% -> +5.16%）、Mode A は +592.0% から +594.4%（PF 6.29 -> 6.43, EV +5.59% -> +5.66%）、Mode B は +667.9% から +670.2%（PF 6.31 -> 6.43, EV +5.30% -> +5.36%）へと全 3 モードで単調向上。HYP-123-2 を支持（Supported）と判定。"
    implication: "マクロベア環境における一時的なショートカバー巻き戻しスパイクと、本物のトレンド初動が過伸長と床防衛の複合条件により精密に識別され、無駄な損失ドローダウンが未然に防止された。"

  - id: OBS-123-4
    topic: "守られた床（Defended Springboard Floor）からの跳躍台反発エントリー（HYP-123-3 Supported）によるWave-2メガトレンド捕捉"
    summary: "ユーザーの構造的洞察に基づき、上昇トレンド前の最安値（P_min）を一度たたいた後、その底値を下回らない中長期 BB_Lower が維持され（bb_lower > P_min かつ margin_floor >= 0.35 ATR）、かつ過伸長後の引き戻し押し目から 1h 陽線反発かつ 1 分足精密反発を確認した瞬間にエントリーを行う跳躍台（Springboard）反発エントリーを導入。"
    evidence: "Stage 2 から Stage 3 への移行において、2024年2月7日（純利益 +17.45%, Wave-2メガトレンド）、2021年2月8日（純利益 +31.57%）、2021年1月5日（純利益 +14.51%）を含む高確信エントリーを追加。全 3 モードの合成成績は以下の通り劇的な単調向上を達成：\n- Master Std: 純利益 +680.7% -> +722.9%（+42.3%pt 拡大）、PF 5.88 -> 6.16、EV +5.16% -> +5.32%\n- Mode A (1-pos exclusive): 純利益 +594.4% -> +641.1%（+46.7%pt 拡大）、PF 6.43 -> 7.06、EV +5.66% -> +5.94%、MaxDD -13.9% -> -8.8%\n- Mode B (2-pos concurrent): 純利益 +670.2% -> +712.5%（+42.3%pt 拡大）、PF 6.43 -> 6.74、EV +5.36% -> +5.52%、MaxDD -12.8% -> -12.8%\n目標基準をすべてのモードで大幅に突破。HYP-123-3 を支持（Supported）と判定。"
    implication: "「底値を下回らない上昇する支持床」を足場とした再加速（跳躍台反発）の幾何学的捕捉に成功し、第 1 波の過伸長に惑わされることなく、最も伸びしろの大きい第 2 波・本格大相場を極限のリスクリワードで捉え切るブレイクスルーが達成された。"
