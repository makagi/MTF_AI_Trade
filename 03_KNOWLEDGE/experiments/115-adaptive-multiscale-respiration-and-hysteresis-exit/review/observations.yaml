observations:
  - id: OBS-115-1
    topic: "構造クロス確定ヒステリシスと損益分岐保護による初動ノイズ被弾の根絶（HYP-115-1 Supported）"
    summary: "EXP-113 における Case 2（2021-01-30 Long: -6.28%）で発生した初動ヒゲによる性急なアンカー繰り上げ（S233 -> S144）の構造的欠陥を解明。下位構造線（S21, S34）が移行先スケール（S_k-1）を順方向にクロスオーバー分離し、移行先スケールの傾きが正転し、かつストップが初期リスクストップを改善しエントリー価格近傍以上に浮上するまでアンカー移行を保留する『構造クロス確定ヒステリシス（Structural Crossover Hysteresis）』を実装。"
    evidence: "Case 2 において初動の下ヒゲ（$32,278）での S144 ストップ被弾を完全回避し、損失を -6.28% から -1.94% へ劇的に圧縮。ロング単独の Profit Factor が 1.66 から 2.15 へ、総純利益が +85.7% から +175.8% へ倍増。Master Mode A においても PF 1.81 -> 2.28、総純利益 +125.3% -> +188.1% へ大幅改善。HYP-115-1 を支持（Supported）と判定。"
    implication: "固定スカラーMFE定数（マジックナンバー）を一切使わず、フィボナッチ構造線同士のクロスオーバー幾何学のみで初動ノイズ耐性とブレイク確定を厳密に識別できることが証明された。"

  - id: OBS-115-2
    topic: "推進期中間スケールフロアと調整期呼気再拡張による大相場完走力（HYP-115-2 Supported）"
    summary: "EXP-113 における Case 1（2020-12-11 Long: +4.82%）の不可逆片道ラチェットによる息切れ（最短期 S21 への過収縮と押し目での早期決済）を解消。中間・親構造線群（S55 > S89 > S144）が Perfect Order かつ順方向傾きを維持している推進期（Impulse Phase）には、アンカーを S55 以下へ過収縮させずフロアを維持し、一時的な下振れに対しては上位スケールへ防衛エンベロープを再拡張（呼気）する自律呼吸モデルを導入。"
    evidence: "Case 1 において 2020-12-14 の 2 ATR 押し目を S55 防衛床で余裕で耐え抜き、保有期間を 55h から 235h へ拡大して $18,098 から $23,281（+28.24%）までメガトレンドを動的完走。大相場推進波における Right-Tail 獲得力を大幅に回復。HYP-115-2 を支持（Supported）と判定。"
    implication: "トレンドフォローにおいてアンカーの不可逆縮小は致命的であり、『推進期の吸気（引き締め）』と『調整期の呼気（上位線への再拡張）』という呼吸の自由度こそがメガトレンド完走の必須幾何学であることが立証された。"

  - id: OBS-115-3
    topic: "武装後モメンタム無効化ガードの非対称性と早期撤退トレードオフの解明（HYP-115-3 Inconclusive）"
    summary: "Case 3（2022-06-19 Short: -6.11%）の歴史的大底セリングクライマックス直後の V 字踏み上げ対策として、武装後であってもマクロ極値過伸長エントリーまたは含み損領域において短期構造逆クロス＋AFS反転で即時離脱するモメンタムガードを検証。"
    evidence: "Case 3 単体では損失を -6.11% から -5.57%（または -1.46%）へ抑制できる効果が確認された。しかし、アブレーション分析（Stage 3）の結果、このガードを全期間に適用すると、初動の揉み合いや健全な一時的揺らぎで勝トレードを途中切断する誤発火が多発し、Long Solo PF が 2.15 -> 1.61（Ret +175.8% -> +87.3%）、Short Solo PF が 2.87 -> 2.51、Master Mode A PF が 2.28 -> 1.53（Ret +188.1% -> +82.9%）へと激減する致命的副作用が判明。HYP-115-3 は保留・制約付き（Inconclusive）と判定。"
    implication: "トレンドフォローモデルにおいて『武装後の短期モメンタム逆行による緊急離脱』は、稀なクライマックス反転の損失を削減する以上に、多数の大きな潜在的利益を刈り取ってしまうという普遍的トレードオフを定量的に解明。"

  - id: OBS-115-4
    topic: "純粋多階層自律呼吸ポートフォリオの真値評価とベースライン維持ガバナンス（EXP-109 堅持）"
    summary: "HYP-115-1 および HYP-115-2 を統合した純粋構造モデル（EXP-115 Pure Master Mode A / Mode B）の総合評価を実施。Master Mode A において N=136, Net EV +1.38%（95% CI [+0.43%, +2.37%]）、Profit Factor 2.28、累積純利益 +188.1%、MaxDD -15.8% を達成。前世代純粋モデル EXP-113（Mode A: PF 1.81, Tot +125.3%, MaxDD -17.2%）を全指標で大幅に凌駕。"
    evidence: "全6暦年中5年で大幅黒字（2020: +57.5%, 2021: +61.2%, 2023: +44.4%, 2024: +25.4%, 2025: +2.6%、2022年ベア相場のみ -2.9%）。純粋構造モデルとして史上最高水準のパフォーマンスを達成したが、確定生産ベースライン EXP-109（Mode A: Tot +274.9% / Master Overall +412.92%, PF 3.83, MaxDD -12.4%）を下回るため、プロジェクト憲章およびガードレール⑥に基づき decision: CONSTRAINED と判定。本番確定ベースラインは EXP-109 を維持。"
    implication: "固定値ゼロの純粋幾何学モデルが EXP-113 から飛躍的進化（総利益 +50%pt増、PF 1.81 -> 2.28）を遂げたことを厳密に立証し、次世代多階層モデルの確固たる到達点として記録。"
