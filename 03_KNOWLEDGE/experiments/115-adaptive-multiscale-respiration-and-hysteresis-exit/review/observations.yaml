observations:
  - id: OBS-115-1
    topic: "構造クロス確定ヒステリシスと損益分岐保護による初動ノイズ被弾の根絶（HYP-115-1 Supported）"
    summary: "EXP-113 における Case 2（2021-01-30 Long: -6.28%）で発生した初動ヒゲによる性急なアンカー繰り上げ（S233 -> S144）の構造的欠陥を解明。下位構造線（S21, S34）が移行先スケール（S_k-1）を順方向にクロスオーバー分離し、移行先スケールの傾きが正転し、かつストップが初期リスクストップを改善しエントリー価格近傍以上に浮上するまでアンカー移行を保留する『構造クロス確定ヒステリシス（Structural Crossover Hysteresis）』を実装。"
    evidence: "Case 2 において初動の下ヒゲ（$32,278）での S144 ストップ被弾を完全回避し、損失を -6.28% から -1.94% へ劇的に圧縮。ロング単独の Profit Factor が 1.63 から 1.90 へ、総純利益が +90.4% から +137.7% へ激増。Master Std においても PF 1.91 -> 2.04、総純利益 +160.3% -> +194.6% へ大幅改善。HYP-115-1 を支持（Supported）と判定。"
    implication: "固定スカラーMFE定数（マジックナンバー）を一切使わず、フィボナッチ構造線同士のクロスオーバー幾何学のみで初動ノイズ耐性とブレイク確定を厳密に識別できることが証明された。"

  - id: OBS-115-2
    topic: "推進期中間スケールフロアと調整期呼気再拡張による大相場完走力（HYP-115-2 Supported）"
    summary: "EXP-113 における Case 1（2020-12-11 Long: +4.82%）の不可逆片道ラチェットによる息切れ（最短期 S21 への過収縮と押し目での早期決済）を解消。中間・親構造線群（S55 > S89 > S144 または S21 > S34 > S55）が順方向かつ slope_55 > 0、sma_55 > p0 を満たす推進期（Impulse Phase）には、アンカーを S55 以下へ過収縮させずフロアを維持し、一時的な下振れに対しては上位スケールへ防衛エンベロープを再拡張（呼気）する自律呼吸モデルを導入。"
    evidence: "Case 1 において 2020-12-14 の 2 ATR 押し目を S55 防衛床で余裕で耐え抜き、保有期間を 55h から 235h へ拡大して $18,098 から $23,281（+28.24%）までメガトレンドを動的完走。Stage 1（+194.6%, PF 2.04）から Stage 2（+253.7%, PF 2.35）へと総利益 +59.1%pt 増加を達成。大相場推進波における Right-Tail 獲得力を大幅に回復。HYP-115-2 を支持（Supported）と判定。"
    implication: "トレンドフォローにおいてアンカーの不可逆縮小は致命的であり、『推進期の吸気（引き締め）』と『調整期の呼気（上位線への再拡張）』という呼吸の自由度こそがメガトレンド完走の必須幾何学であることが立証された。"

  - id: OBS-115-3
    topic: "武装後モメンタム無効化ガードの非対称性と早期撤退トレードオフの解明（HYP-115-3 Inconclusive）"
    summary: "Case 3（2022-06-19 Short: -6.11%）の歴史的大底セリングクライマックス直後の V 字踏み上げ対策として、武装後であってもマクロ極値過伸長エントリーまたは含み損領域において短期構造逆クロス＋AFS反転で即時離脱するモメンタムガードを検証。"
    evidence: "Case 3 単体では損失を -6.11% から -3.86%（保有 100h -> 22h）へ抑制できる効果が確認された。しかし、アブレーション分析（Stage 3）の結果、このガードを全期間に適用すると、初動の揉み合いや健全な一時的揺らぎで勝トレードを途中切断する誤発火が多発し、Long Solo PF が 2.20 -> 1.79（Ret +185.2% -> +115.5%）、Master Std PF が 2.35 -> 1.95（Ret +253.7% -> +172.1%）、Mode A PF が 2.36 -> 1.59（Ret +196.3% -> +93.8%）へと激減する致命的副作用が判明。HYP-115-3 は保留・制約付き（Inconclusive）と判定。"
    implication: "トレンドフォローモデルにおいて『武装後の短期モメンタム逆行による緊急離脱』は、稀なクライマックス反転の損失を削減する以上に、多数の大きな潜在的利益を刈り取ってしまうという普遍的トレードオフを定量的に解明。"

  - id: OBS-115-4
    topic: "純粋多階層自律呼吸ポートフォリオの真値評価とベースライン維持ガバナンス（EXP-109 堅持）"
    summary: "HYP-115-1 および HYP-115-2 を統合した純粋構造モデル（EXP-115 Pure Master Std / Mode A / Mode B）の総合評価を実施。Master Std (N=166) において Net EV +1.53%、PF 2.35、累積純利益 +253.7%、MaxDD -22.4% を達成。Mode A (N=135) においても Net EV +1.45%（95% CI [+0.50%, +2.48%]）、PF 2.36、累積純利益 +196.3%、MaxDD -15.5% を記録。前世代純粋モデル EXP-113（Std: PF 2.00, Tot +160.4%; Mode A: PF 1.82, Tot +126.2%）を全指標で大幅に凌駕。"
    evidence: "全6暦年中5年で大幅黒字（2020: +57.5%, 2021: +60.3%, 2023: +43.3%, 2024: +32.4%, 2025: +5.9%、2022年ベア相場のみ -3.0%）。純粋構造モデルとして史上最高水準のパフォーマンスを達成したが、確定生産ベースライン EXP-109（Std: Tot +412.92%, PF 3.83, MaxDD -21.2%; Mode A: Tot +274.9%, PF 3.07, MaxDD -12.2%）を下回るため、プロジェクト憲章およびガードレール⑥に基づき decision: CONSTRAINED と判定。本番確定ベースラインは EXP-109 を維持。"
    implication: "固定値ゼロの純粋幾何学モデルが EXP-113 から飛躍的進化（標準純利益 +93.3%pt増、PF 2.00 -> 2.35）を遂げたことを厳密に立証し、次世代多階層構造ベンチマークとして記録。"

  - id: OBS-115-5
    topic: "Case 2 の真の構造要因（エントリー早期掴みと再エントリー点クロス硬直性）の解明"
    summary: "Case 2（2021-01-30 03:00 Long）が EXP-115 で -1.94%（structural_invalidation）となり、直後の $52,000 大相場（+51.22%）に乗れなかった要因を実データから解明。"
    evidence: "① エントリー自体の問題: 2021-01-29 16:00 の $38,552 クライマックス急騰からの急反落中、t0 = 2021-01-30 02:00（close = $34,293）は S21 ($35,309) および S34 ($34,416) の遥か下にあり、afs_order_score == 0 の自由落下状態であったにもかかわらず prop_events_fast が S55 付近通過だけで早仕掛けしていた。その後の下ヒゲ（$32,278）は S233 - 1.0 ATR ($32,301) を割り込んでおり、EXP-115 が $33,650（-1.94%）で撤退したのは正しい防御であった。② 再エントリー不発: S233 上で二番底形成後、2021-02-02 07:00（$33,889）に価格が S21/S34 を上抜けた時点では遅行する S55 の傾きが微マイナス（-0.027）で mvc_long 不発。4時間後の 11:00（$34,681）に完全パーフェクトオーダーと slope_55 > 0 が完成したが、価格が S34 を抜けた瞬間（1バー）が過ぎていたため再エントリーできなかった。"
    implication: "エグジットのヒステリシス・呼吸化（EXP-115）に続き、エントリー側も『1バーの点クロス』から『多階層構造クロス整列完了イグニッション（および落下ナイフ遮断）』へ進化させる必要性が強く示唆された。"
